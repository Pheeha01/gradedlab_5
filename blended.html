<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="blended.css">
    <script src="blended.js" defer></script>
</head>
<body>
    <h1>Mr. Surname Blender</h1> 
    <div> 
        <span>Surname:</span> 
        <input id="surname" type="text" size="20" /> 
    </div> 
    <div> 
        <span>Font:</span> 
        <select id="font"> 
            <option>Arial</option> 
            <option>Comic Sans MS</option> 
            <option>Times New Roman</option> 
        </select> 
    </div> 
    <div> 
    <span>Position:</span> 
        <input id="sequential" name="pos" type="radio" value="seq" checked="checked"/>Sequential 
        <input id="random" name="pos" type="radio" value="rand" /> Random 
        <input id="reverse" name="pos" type="radio" value="rev" /> Reverse
    </div> <div> 
</body>
</html>
