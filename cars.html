<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cars.css">
    <script src="cars.js" defer></script>
</head>
<body>
    <h1>Vintage Cars </h1>
    <p>Guess which car belongs to which make? </p>
    <div id="car-info">
        <h2><span id="car-name"></span> (<span id="car-type"> </span>)</h2>
        <img class="hidden" id="car-img" src="" alt="super cute car" />
    </div>
    <div id="guess-ui">
        Make:
        <select id="make-list">
            <option>Select Car</option>
            <option id="VW">VW</option>
            <option id="BMW">BMW</option>
            <option id="Benz">Benz</option>
            <option id="Audi">Audi</option>
            <option id="Ford">Ford</option>
            <option id="Toyota">Toyota</option>
        </select>
        
        <button class="disabled" id="guess-btn">Guess!</button>
    </div>
    <div>
        <p>Correct guesses: <span id="correct">0</span></p>
        <p>Total guesses: <span id="total">0</span></p>
    </div>
</body>
</html>
